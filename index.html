<body class="container">
    <!-- Deep Cosmic Nebula Atmosphere -->
    <div class="night"></div>

    <!-- Space Starfield & Shooting Stars Canvas -->
    <canvas id="space-canvas"></canvas>

    <!-- TOP-RIGHT BIRTHDAY NEGATIVE COUNTDOWN (Her Birthday: 30/01) -->
    <div class="birthday-counter" id="birthdayCounter">
      <div class="counter-timer">
        <span class="counter-sign" title="Counting down towards her birthday">-</span>
        <div class="time-unit">
          <span class="time-digit" id="cntDays">000</span>
          <span class="time-label">DAYS</span>
        </div>
        <span class="time-colon">:</span>
        <div class="time-unit">
          <span class="time-digit" id="cntHours">00</span>
          <span class="time-label">HOURS</span>
        </div>
        <span class="time-colon">:</span>
        <div class="time-unit">
          <span class="time-digit" id="cntMins">00</span>
          <span class="time-label">MINS</span>
        </div>
        <span class="time-colon">:</span>
        <div class="time-unit">
          <span class="time-digit" id="cntSecs">00</span>
          <span class="time-label">SECS</span>
        </div>
      </div>
    </div>

    <!-- UPPER SECTION: Celestial Actions & Floating Elements -->
    <div class="upper-section" id="upperSection">
      <!-- Floating Celestial Trigger Button -->
      <button class="journal-trigger-btn" id="openJournalBtn" type="button" aria-label="Open Daily Thoughts Journal">
        <span class="journal-btn-icon">✨</span>
        <span class="journal-btn-text">Daily Thoughts</span>
        <span class="journal-btn-badge" id="journalUnreadBadge" title="Write a thought for today">✦</span>
      </button>
    </div>

    <!-- CELESTIAL STAR PHOTO ORBS (Floating circular memories in space behind heart) -->
    <div class="cosmic-photo-stars-field" id="cosmicPhotoStars">
      <!-- Star Orb 1 -->
      <div class="star-photo-orb star-photo-orb--1" data-photo="1" title="Her starry memory ✨ (Click to view)">
        <div class="star-orb-halo"></div>
        <div class="star-orb-ring">
          <img src="img/photo1.jpg" alt="Her starry memory 1" class="star-photo-img star-photo-img--1" loading="eager" />
        </div>
        <div class="star-orb-flare"></div>
        <div class="star-orb-badge">🌸</div>
      </div>

      <!-- Star Orb 2 -->
      <div class="star-photo-orb star-photo-orb--2" data-photo="2" title="Her starry memory 💐 (Click to view)">
        <div class="star-orb-halo"></div>
        <div class="star-orb-ring">
          <img src="img/photo2.jpg" alt="Her starry memory 2" class="star-photo-img star-photo-img--2" loading="eager" />

        <div class="star-orb-badge">✨</div>
      </div>

      <!-- Star Orb 3 -->

        <div class="star-orb-badge">💫</div>
      </div>
    </div>

      <div class="pixel-heart-aura" id="pixelHeartAura"></div>

          <span class="heart-mode-dot"></span>
          <span class="heart-mode-label" id="heartModeLabel">X-Axis Spin ↺</span>
        </button>
      </div>
    </div>

    <div class="journal-backdrop" id="journalBackdrop">
      <div class="journal-card" id="journalCard" role="dialog" aria-modal="true" aria-labelledby="journalTitle">
        <!-- Journal Header -->
        <div class="journal-header">
          <div class="journal-header-info">
            <div class="journal-header-meta">
              <span class="journal-tag">HER PRIVATE SANCTUARY</span>
              <span class="cloud-status-badge" id="cloudStatusBadge" title="Cloud Database Sync Status">
                <span class="cloud-status-dot"></span>
                <span class="cloud-status-text" id="cloudStatusText">Connecting...</span>
              </span>
            </div>
            <h2 class="journal-title" id="journalTitle">Daily Thoughts 💫</h2>
            <span class="journal-date" id="journalCurrentDate">Today</span>
          </div>
          <button class="journal-close-btn" id="closeJournalBtn" type="button" aria-label="Close Journal">✕</button>
        </div>

        <!-- Tab Bar: Write Today / Past Stars -->
        <div class="journal-tabs">
          <button class="journal-tab active" id="tabWriteBtn" type="button">✨ Write Thought</button>
          <button class="journal-tab" id="tabArchiveBtn" type="button">📜 Star Memories (<span id="archiveCount">0</span>)</button>
        </div>

        <!-- Tab 1: Write Today's Thought -->
        <div class="journal-tab-pane active" id="paneWrite">
          <!-- Mood Selector -->
          <div class="journal-mood-section">
            <label class="journal-label">How are you feeling today?</label>
            <div class="mood-picker" id="moodPicker">
              <button type="button" class="mood-pill active" data-mood="🌸 Peaceful">🌸 Peaceful</button>
              <button type="button" class="mood-pill" data-mood="✨ Happy">✨ Happy</button>
              <button type="button" class="mood-pill" data-mood="🌙 Dreamy">🌙 Dreamy</button>
              <button type="button" class="mood-pill" data-mood="💖 Loving">💖 Loving</button>
              <button type="button" class="mood-pill" data-mood="☁️ Reflective">☁️ Reflective</button>
            </div>
          </div>

          <!-- Note Textarea -->
          <div class="journal-input-section">
            <label class="journal-label" for="thoughtInput">Dear Universe...</label>
            <textarea
              id="thoughtInput"
              class="thought-textarea"
              rows="5"
              placeholder="Write whatever is on your mind or in your heart today... whispers, wishes, or little moments ✨"
              maxlength="2000"
            ></textarea>
            <div class="journal-char-count"><span id="thoughtCharCount">0</span> / 2000</div>
          </div>

          <!-- Action Bar -->
          <div class="journal-actions">
            <button class="journal-btn journal-btn-primary" id="saveThoughtBtn" type="button">
              <span>Save to the Stars ✨</span>
            </button>
          </div>
        </div>

        <!-- Tab 2: Past Star Memories Archive -->
        <div class="journal-tab-pane" id="paneArchive">
          <div class="archive-header">
            <span class="archive-subtitle">Saved everyday thoughts & memories</span>
            <button class="journal-btn-small" id="exportThoughtsBtn" type="button" title="Download your thoughts as a text file">Export 📥</button>
          </div>
          <div class="thought-archive-list" id="thoughtArchiveList">
            <!-- Dynamically populated past thoughts or empty state -->
          </div>
        </div>

        <!-- Toast Notification inside Journal -->
        <div class="journal-toast" id="journalToast">Thought preserved in the stars ✨</div>
      </div>
    </div>
